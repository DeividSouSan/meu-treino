name: CI Pipeline

on:
  push:
    branches:
      - develop
      - homolog
      - main
  pull_request:
    branches:
      - develop
      - homolog
      - main

jobs:
  quality:
    name: Qualidade & Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck (TypeScript)
        run: npx tsc -b

      - name: Linter (Oxlint)
        run: npm run lint

      - name: Testes Unitários (Vitest)
        run: npm test

      - name: Build da Aplicação
        run: npm run build
