<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Aplicativo pessoal e minimalista para rastreamento de musculação."
    />
    <title>Meu Treino</title>
    <script>
      // Aplica o tema antes do primeiro paint para evitar flash de tela clara.
      // A chave e as cores devem ficar em sincronia com o ThemeProvider.
      (function () {
        try {
          var storedTheme = localStorage.getItem('meu_treino_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = storedTheme === 'dark' || (storedTheme !== 'light' && prefersDark);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');

          var themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute('content', isDark ? '#1a1a1a' : '#ffffff');
          }
        } catch (error) {
          // Sem acesso ao localStorage, o CSS mantém o tema claro como fallback.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
